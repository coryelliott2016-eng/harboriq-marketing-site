<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=satoshi@400,500,600,700&display=swap"
      rel="stylesheet"
    />

    <title>HarborIQ — The Operating System for Marine Service Businesses</title>
    <meta
      name="description"
      content="HarborIQ is the operating system for marine service businesses: CRM, AI-assisted dispatch, Stripe invoicing, marina slip and mooring management, an offline field app, and a customer portal — built for mobile mechanics, boatyards, and marinas."
    />
    <meta name="theme-color" content="#0B2239" />
    <meta name="author" content="HarborIQ, Inc." />
    <meta name="robots" content="index, follow" />

    <!-- Canonical (placeholder until the production domain is live) -->
    <link rel="canonical" href="https://harboriq.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="HarborIQ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harboriq.com/" />
    <meta property="og:title" content="HarborIQ — The Operating System for Marine Service Businesses" />
    <meta
      property="og:description"
      content="CRM, AI-assisted dispatch, Stripe invoicing, marina slip and mooring management, an offline PWA field app, and a customer portal — one system for mobile marine mechanics, boatyards, and marinas."
    />
    <meta property="og:image" content="https://harboriq.com/og-image.jpg" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:image:alt"
      content="A marine technician reviews a job on a tablet along a marina dock at dusk"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HarborIQ — The Operating System for Marine Service Businesses" />
    <meta
      name="twitter:description"
      content="CRM, AI-assisted dispatch, Stripe invoicing, marina slip and mooring management, an offline PWA field app, and a customer portal for marine service businesses."
    />
    <meta name="twitter:image" content="https://harboriq.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="A marine technician reviews a job on a tablet along a marina dock at dusk"
    />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://harboriq.com/#organization",
        "name": "HarborIQ, Inc.",
        "alternateName": "HarborIQ",
        "url": "https://harboriq.com/",
        "logo": "https://harboriq.com/apple-touch-icon.png",
        "image": "https://harboriq.com/og-image.jpg",
        "description": "HarborIQ builds the operating system for marine service businesses — mobile marine mechanics, boatyards, and marinas.",
        "email": "Cory@HarborIQ.com",
        "founder": {
          "@type": "Person",
          "name": "Cory Elliott",
          "jobTitle": "Founder",
          "description": "ABYC-certified marine technician and founder of Off the Hook Marine Specialist."
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sarasota",
          "addressRegion": "FL",
          "addressCountry": "US"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "Cory@HarborIQ.com",
          "availableLanguage": "English"
        }
      }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://harboriq.com/#software",
        "name": "HarborIQ",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Marine service management",
        "operatingSystem": "Web, iOS, Android (progressive web app)",
        "url": "https://harboriq.com/",
        "image": "https://harboriq.com/og-image.jpg",
        "description": "Marine service management software: CRM, AI-assisted dispatch, Stripe invoicing and Connect payouts, marina slip/mooring/dry-stack management with double-booking prevention, an offline-capable field app, and a customer portal.",
        "featureList": [
          "Marine CRM for boats, owners, and service history",
          "AI-assisted dispatch and scheduling",
          "Stripe invoicing and Connect payouts",
          "Marina slip, mooring, and dry-stack management with double-booking prevention",
          "Offline-capable PWA field app",
          "Customer portal"
        ],
        "publisher": { "@id": "https://harboriq.com/#organization" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
